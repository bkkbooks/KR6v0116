front:
  text: 讚禮地藏菩薩懺悔發願法整理者張曉麗題解讚禮地藏菩薩懺悔發願法中國人所撰禮懺發願文中國佛教三階教經典一卷作者不詳地藏菩薩是中國佛教崇奉的四大菩薩之一地藏信仰也是中國佛教的重要信仰形態之一作為幽冥教主地藏菩薩在中國佛教中占有獨特的地位但地藏信仰在中國有一個發生發展的過程兩晉南北朝時期在佛典中地藏菩薩只是作為參加者偶爾出現在釋迦牟尼的法會上進入隋唐以後他的地位逐漸提高正式成為人們禮讚崇拜的對象並由此出現一批與地藏菩薩相關的典籍讚禮地藏菩薩懺悔發願法亦為其中之一本文獻抄寫於唐代約為七世紀後半葉到八世紀上半葉值得注意的是第一從本文獻看地藏菩薩完全沒有顯現出幽冥教主的神格這說明直到八世紀上半葉地藏菩薩還不具備後世賦豫的幽冥教主的身份第二本文獻雖然名為讚禮地藏菩薩懺悔發願法但其禮拜對象卻極其龐雜並非僅禮拜地藏菩薩這種表現形態蘊含著什麼意義值得進一步研究第三本文獻抄寫在敦煌遺書號的末尾該遺書共抄寫三個文獻前面所抄的兩個文獻分別為七階佛名經與人集録依諸大乘經中略發願法由於前兩個文獻均為公認的三階教經典而讚禮地藏菩薩懺悔發願法的內容又與人集録依諸大乘經中略發願法及三階教思想相互呼應因此可以肯定讚禮地藏菩薩懺悔發願法也屬於三階教經典所以地藏菩薩信仰與三階教的關係應該成為我們關注的問題而對這一點以前學術界尚缺乏充分的重視總之本文獻是研究地藏信仰在中國形成與發展的重要資料也是近年發現的關於三階教的新資料對三階教研究具有重要價值本文獻的抄本至今在敦煌遺書中僅發現一號整理本的底校本如下底本號校本無録文
