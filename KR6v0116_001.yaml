body:
  text: 至心歸命稽首禮釋迦牟尼佛所讚地藏菩薩摩訶薩五濁惡世救苦者久修堅固大願悲勇猛精進超衆聖每日晨朝從定起垂形六趣化十方願救諸衆生離苦得解脫昔在佉羅帝耶山諸牟尼仙所住處從南方來現五瑞香華寶飾衣雲雨演出百千妙法音衆身堅重如大地香鬘寶衣自嚴飾兩手各現如意珠光照十方諸佛國見聞三障永清淨故我稽首大慈悲地藏菩薩摩訶薩願救諸衆生離苦得解脫曾於過去無數劫刀兵疫病饑饉時復於當來過是數救度無間惡衆生八十百千那庾多頻跋羅數菩薩衆眷屬悉現聲聞像照臨大集禮世尊讚佛散華成寶蓋大衆咸供唱善哉故我稽首大慈悲地藏菩薩摩訶薩願救諸衆生離苦得解脫首楞伽摩三摩地善能悟入佛境界已能最勝無生忍於諸佛法得自在已能堪忍一切智已能超渡遍智海故我稽首大慈悲地藏菩薩摩訶薩願救諸衆生離苦得解脫獅子奮迅幢三昧善登一切智山王能伏外道諸邪論為欲成熟諸有情所在佛國皆現住發起無量勝功德故我稽首大慈悲地藏菩薩摩訶薩願救諸衆生離苦得解脫敬禮現作諸天身色界梵王大自在欲界他化自在天樂變化天覩史多夜摩帝釋四天王地藏菩薩摩訶薩願說正法救衆生離苦得解脫敬禮現作聖人身大乘佛身菩薩身二乘獨覺聲聞身地藏菩薩摩訶薩願說正法救衆生離苦得解脫敬禮現作凡人身轉輪王身剎帝利婆羅門身茂捨身茂字吠音戌達羅身丈夫身婦女童男童女身地藏菩薩摩訶薩願說正法救衆生離苦得解脫敬禮現作鬼神身揵達縛身阿素洛緊捺洛身大蟒身龍身藥叉羅剎身鳩槃荼身畢舍遮餓鬼羯吒布怛那奧闍訶洛諸鬼身地藏菩薩摩訶薩願說正法救衆生離苦得解脫敬禮現作畜生身獅子香象牛馬身種種異類禽獸身地藏菩薩摩訶薩願說正法救衆生離苦得解脫敬禮現作地獄身剡魔王身獄卒身地獄有情異類身地藏菩薩摩訶薩願說正法救衆生離苦得解脫敬禮善說陀羅尼地藏菩薩摩訶薩願救諸衆生離苦得解脫敬禮滿願如意珠地藏菩薩摩訶薩願救諸衆生離苦得解脫敬禮富德如寶渚地藏菩薩摩訶薩願救諸衆生離苦得解脫敬禮莊嚴如天樹地藏菩薩摩訶薩願救諸衆生離苦得解脫敬禮無畏如師子地藏菩薩摩訶薩願救諸衆生離苦得解脫敬禮破暗如朗日地藏菩薩摩訶薩願救諸衆生離苦得解脫敬禮示道如明月地藏菩薩摩訶薩願救諸衆生離苦得解脫敬禮依止如大地地藏菩薩摩訶薩願救諸衆生離苦得解脫敬禮堅住如高山地藏菩薩摩訶薩願救諸衆生離苦得解脫敬禮攝受如虛空地藏菩薩摩訶薩願救諸衆生離苦得解脫至心懺悔歸命釋迦牟尼佛地藏菩薩摩訶薩我從無始生死來愚癡憍慢毀三寶身語意業種種惡自作教他見隨喜今對佛前皆發露慚愧懺悔願除滅從今已往永不作防護當來諸罪咎懺悔已歸命三寶至心發願我今至誠發誓願從今生死盡後際常願不逢惡知識亦願不遇惡因緣設當逢遇願不隨決定不謗佛正法亦不惱亂出家人勿令我受長夜苦唯願慈尊哀攝受我等所發真誓願發願已歸命三寶録文完方廣錩修改審定
